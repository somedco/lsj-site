services:
  nginx:
    image: nginx:alpine
    container_name: lsj-site
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./sites/lsj:/usr/share/nginx/sites/lsj:ro
      - ./nginx.conf:/etc/nginx/templates/lsj.conf.template:ro
    environment:
      TURSO_HOST: ${TURSO_HOST}
      TURSO_TOKEN: ${TURSO_TOKEN}

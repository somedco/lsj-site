<!doctype html>
<html lang="en" data-type="software">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LSJ Greek–English Lexicon</title>
    <meta name="description" content="Look up a Greek word or an English definition in the Liddell & Scott lexicon." />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <meta name="theme-color" content="#2a1720" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LSJ Greek–English Lexicon" />
    <meta property="og:description" content="Look up a Greek word or an English definition in the lexicon of Liddell & Scott." />
    <meta property="og:image" content="/share.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/style.css" />
    <script>document.documentElement.classList.add('m-enter');</script>
  </head>
  <body>
    <a class="skip-link" href="#top">Skip to content</a>
    <div class="wrap">
      <header class="site-head">
        <a class="brand" href="#top">LSJ</a>
        <a class="head-link" href="#source">Source</a>
      </header>

      <section class="hero" id="top" data-enter>
        <p class="symbol greek" aria-hidden="true">λ</p>
        <h1>The lexicon</h1>
        <form id="search-form" autocomplete="off">
          <label for="q">Word or definition</label>
          <div class="field">
            <input
              id="q"
              name="q"
              type="search"
              placeholder="Search the lexicon"
              spellcheck="false"
              autocapitalize="off"
              autocomplete="off"
            />
            <button class="find" type="submit">Find a word</button>
          </div>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section id="results" class="results" aria-label="Lexicon entries"></section>

      <section class="source" id="source" aria-labelledby="source-title">
        <h2 id="source-title">Source</h2>
        <p>
          Lexicon text: <em>A Greek–English Lexicon</em> by Henry George Liddell and Robert Scott.
          Unicode conversion by Giuseppe G. A. Celano. Licensed
          <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA</a>;
          attribution is required and use is non-commercial.
        </p>
      </section>

      <footer class="site-foot">
        <a href="#top">Back to top ↑</a>
      </footer>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>

# nginx config for the LSJ lexicon front-end.
# docker-compose.yml mounts this file at /etc/nginx/templates/lsj.conf.template,
# so the official nginx image replaces ${TURSO_HOST} and ${TURSO_TOKEN} with the
# values from .env when the container starts. Never put the token in this file or in git.

# All visitors arrive from one cloudflared tunnel IP, so this limit is shared.
limit_req_zone $binary_remote_addr zone=lsjsearch:10m rate=10r/s;

server {
    listen 80;
    # Replace with the real hostname that Cloudflare Tunnel sends for this site.
    server_name lsj.example.com;
    root /usr/share/nginx/sites/lsj;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The read-only Turso token is injected here, so it never reaches the browser.
    location = /api/query {
        limit_req zone=lsjsearch burst=20 nodelay;
        client_max_body_size 16k;

        proxy_ssl_server_name on;
        proxy_pass https://${TURSO_HOST}/v2/pipeline;
        proxy_set_header Host ${TURSO_HOST};
        proxy_set_header Authorization "Bearer ${TURSO_TOKEN}";
        proxy_set_header Content-Type application/json;
        proxy_read_timeout 30s;
    }
}
